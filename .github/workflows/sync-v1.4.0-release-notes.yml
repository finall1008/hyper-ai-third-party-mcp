name: Sync v1.4.0 release notes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-v1.4.0-release-notes.yml'

permissions:
  contents: write

jobs:
  sync:
    name: Update v1.4.0 release body
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare release notes
        run: |
          awk '
            index($0, "## 1.4.0 - ") == 1 || $0 == "## 1.4.0" {
              printing = 1
              next
            }
            printing && /^## / { exit }
            printing { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md

      - name: Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.4.0
          name: 超级小爱增强 v1.4.0
          body_path: release-notes.md

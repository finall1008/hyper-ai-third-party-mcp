name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and publish
        required: true
        default: v1.7.0

permissions:
  contents: write

jobs:
  publish:
    name: Build and publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install Android SDK packages
        run: sdkmanager --channel=3 "platforms;android-37.0" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          DECLARED_VERSION=$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)"/\1/p' app/build.gradle.kts)
          test -n "$VERSION"
          test "$DECLARED_VERSION" = "$VERSION"
          grep -F -q "## $VERSION - " CHANGELOG.md

      - name: Check release signing configuration
        id: signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && \
             [ -n "$RELEASE_STORE_PASSWORD" ] && \
             [ -n "$RELEASE_KEY_ALIAS" ] && \
             [ -n "$RELEASE_KEY_PASSWORD" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode release keystore
        if: steps.signing.outputs.configured == 'true'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          XIAOAI_RELEASE_STORE_FILE: ${{ runner.temp }}/release-keystore.jks
        run: printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$XIAOAI_RELEASE_STORE_FILE"

      - name: Test and build release APK
        env:
          XIAOAI_RELEASE_STORE_FILE: ${{ runner.temp }}/release-keystore.jks
          XIAOAI_RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          XIAOAI_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          XIAOAI_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleRelease

      - name: Verify minimized module artifact
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          MAPPING=app/build/outputs/mapping/release/mapping.txt
          unzip -t "$APK"
          test -s "$MAPPING"

      - name: Remove release keystore
        if: always()
        run: rm -f "${{ runner.temp }}/release-keystore.jks"

      - name: Prepare release notes
        if: steps.signing.outputs.configured == 'true'
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          awk -v version="$VERSION" '
            index($0, "## " version " - ") == 1 || $0 == "## " version {
              printing = 1
              next
            }
            printing && /^## / { exit }
            printing { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md

      - name: Publish APK to GitHub Release
        if: steps.signing.outputs.configured == 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: 超级小爱增强 ${{ inputs.tag || github.ref_name }}
          body_path: release-notes.md
          files: app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true

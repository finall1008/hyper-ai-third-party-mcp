name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and publish
        required: true
        default: v1.0

permissions:
  contents: write

jobs:
  publish:
    name: Build and publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager --channel=3 "platforms;android-37.0" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check release signing configuration
        id: signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && \
             [ -n "$RELEASE_STORE_PASSWORD" ] && \
             [ -n "$RELEASE_KEY_ALIAS" ] && \
             [ -n "$RELEASE_KEY_PASSWORD" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode release keystore
        if: steps.signing.outputs.configured == 'true'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          XIAOAI_RELEASE_STORE_FILE: ${{ runner.temp }}/release-keystore.jks
        run: printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$XIAOAI_RELEASE_STORE_FILE"

      - name: Test and build release APK
        env:
          XIAOAI_RELEASE_STORE_FILE: ${{ runner.temp }}/release-keystore.jks
          XIAOAI_RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          XIAOAI_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          XIAOAI_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleRelease

      - name: Verify minimized module artifact
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          MAPPING=app/build/outputs/mapping/release/mapping.txt
          unzip -t "$APK"
          test -s "$MAPPING"
          if grep -q '^kotlin\.coroutines\.' "$MAPPING"; then
            echo "Release APK contains module-local kotlin.coroutines runtime classes" >&2
            exit 1
          fi

      - name: Remove release keystore
        if: always()
        run: rm -f "${{ runner.temp }}/release-keystore.jks"

      - name: Publish APK to GitHub Release
        if: steps.signing.outputs.configured == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true
